services:
  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/ubuntusrv2/working/nanoserve-observability/prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - nanoserve-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_RENDERING_RENDERER_TOKEN: "${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN in .env}"
    volumes:
      - /home/ubuntusrv2/working/nanoserve-observability/grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - renderer
    networks:
      - nanoserve-net

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-image-renderer
    hostname: renderer
    restart: unless-stopped
    environment:
      AUTH_TOKEN: "${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN in .env}"
    networks:
      - nanoserve-net

  dcgm-exporter:
    # Tag zweryfikowany w nvcr.io 2026-08-11 (DCGM 4.5.2 / exporter 4.8.1).
    # Wbudowany hostengine w kontenerze; pola PROF wymagaja CAP_SYS_ADMIN
    # (celowo cap_add, NIE privileged). Koegzystencja z host-side `dcgmi dmon`
    # testowana w docs/plans/2026-08-12-dcgm-observability.md (Cz. 3).
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
    container_name: dcgm-exporter
    hostname: dcgm-exporter
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "${DCGM_EXPORTER_HOST_PORT:-9400}:9400"
    volumes:
      - ./dcgm/dcgm-counters.csv:/etc/dcgm-exporter/nanoserve-counters.csv:ro
    # -c 5000 = interwal zbierania 5 s, spojny z scrape_interval Prometheusa
    command: ["-f", "/etc/dcgm-exporter/nanoserve-counters.csv", "-c", "5000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - nanoserve-net

networks:
  nanoserve-net:
    external: true
